name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ileraher_cycle_test
          POSTGRES_USER: cycle_test
          POSTGRES_PASSWORD: cycle_test_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYCLE_TEST_DATABASE_URL: postgres://cycle_test:cycle_test_local_only@localhost:5432/ileraher_cycle_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/ileraher-sim-call/requirements-dev.txt
      - name: Install call media dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
        env:
          SIM_TEST_PYTHON: python
      - run: python -m pytest services/ileraher-sim-call
      - run: npm run build
      - run: python services/ileraher-natlas-space/test_runtime.py
