name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/ileraher-sim-call/requirements-dev.txt
      - run: npm test
        env:
          SIM_TEST_PYTHON: python
      - run: python -m pytest services/ileraher-sim-call
      - run: npm run build
      - run: python services/ileraher-natlas-space/test_runtime.py
