name: Upload IleraHer Hugging Face runtime
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ileraher-hf-runtime-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install upload client
        run: python -m pip install huggingface_hub==0.35.3
      - name: Upload four runtime files
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_WRITE_TOKEN }}
        run: python scripts/upload_hf_runtime.py
