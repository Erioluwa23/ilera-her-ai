services:
  - type: web
    name: ilera-her-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HF_TOKEN
        sync: false
      - key: AUTH_SECRET
        sync: false
